<main class="min-h-screen flex items-center justify-center bg-gray-100 px-4">
  <div class="bg-white p-6 md:p-8 rounded-xl shadow-xl w-full max-w-sm transition-all">
    <form [formGroup]="loginForm" class="flex flex-col space-y-5">
      <div>
        <label for="email" class="block text-sm font-semibold text-gray-700">Insira aqui o seu email</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          formControlName="email"
          placeholder="exemplo@dominio.com"
          class="mt-1 border border-gray-300 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 p-2 rounded w-full outline-none"
          required
        />
      </div>
      
      <div>
        <label for="senha" class="block text-sm font-semibold text-gray-700">Insira aqui a sua senha</label>
        <input 
          type="password" 
          id="senha" 
          name="senha"
          formControlName="senha" 
          placeholder="********"
          class="mt-1 border border-gray-300 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 p-2 rounded w-full outline-none"
          required
        />
      </div>

      <div class="text-right">
        <a routerLink="/esqueci-minha-senha" class="text-sm text-purple-600 hover:underline">
          Esqueci minha senha
        </a>
      </div>

      <button 
        type="submit"
        [disabled]="loginBtnDisable"
        (click)="login()"
        [ngClass]="
          {'bg-gray-700 text-white hover:bg-gray-800 cursor-pointer': !loginBtnDisable,
          'bg-gray-400 text-gray-200 cursor-not-allowed opacity-70': loginBtnDisable
        }"
        class="py-2 px-4 rounded transition-colors"
      >
        {{ loginBtnMsg }}
      </button>
    </form>
  </div>
</main>
