<div class="fixed inset-0 bg-black bg-opacity-50 flex justify-center items-center z-50">
  <div class="bg-white rounded-lg shadow-md p-6 space-y-4 w-full max-w-sm mx-4">
    <h3 class="text-lg font-semibold text-center">Confirmação</h3>
    <p class="text-gray-600 text-center">{{ message }}</p>
    <div class="flex justify-center items-center space-x-4 pt-4">
      <button 
        (click)="onClose()"
        class="bg-gray-200 hover:bg-gray-300 text-gray-800 px-6 py-2 rounded"
      >
        Não
      </button>
      <button 
        (click)="onConfirm()"
        class="bg-red-600 hover:bg-red-700 text-white px-6 py-2 rounded"
      >
        Sim
      </button>
    </div>
  </div>
</div>
