<!-- Conteúdo da Página -->
<div *ngIf="content" class="container mx-auto max-w-4xl px-4 py-16">
  
  <article class="prose lg:prose-xl max-w-none">
    <!-- Cabeçalho do Artigo -->
    <header class="mb-12 text-center border-b pb-8">
      <h1 class="text-5xl font-extrabold text-gray-900 mb-4">{{ content.titulo }}</h1>
    </header>

    <!-- Imagem de Capa -->
    <figure class="mb-12">
      <img [src]="content.capa_url" alt="Imagem referente à Lei Henry Borel" class="w-full h-auto rounded-lg shadow-lg">
    </figure>

    <!-- Corpo do Artigo com Parágrafos -->
    <div class="space-y-8">
      <ng-container *ngFor="let paragraph of content.paragrafos">
        <!-- Conteúdo do parágrafo -->
        <p class="text-lg leading-relaxed text-gray-700">
          {{ paragraph }}
        </p>
      </ng-container>
    </div>
  </article>

  <app-moreArticles></app-moreArticles>

</div>
