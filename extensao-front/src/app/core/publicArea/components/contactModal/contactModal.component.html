<div
  (click)="closeModal()"
  class="fixed inset-0 bg-black bg-opacity-70 z-40 flex justify-center items-center"
>
  <div 
    (click)="$event.stopPropagation()"
    class="relative bg-white rounded-lg shadow-xl w-11/12 max-w-2xl p-8 transform transition-all"
  >
    <button (click)="closeModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
      </svg>
    </button>
    
    <h2 class="text-2xl font-bold text-gray-800 mb-2">Contate-nos</h2>
    <p class="text-sm text-gray-500 mb-6">Ficaremos felizes em receber sua mensagem.</p>

    <form [formGroup]="contactForm" (ngSubmit)="submitForm()" class="space-y-6">
      <div>
        <label for="nome" class="block text-sm font-medium text-gray-700">Seu Nome</label>
        <input 
          formControlName="nome" 
          id="nome" 
          type="text"
          placeholder="Digite seu nome completo"
          class="mt-1 block w-full px-3 py-2 border rounded-md shadow-sm focus:outline-none focus:ring-purple-500 focus:border-purple-500"
          [ngClass]="{'border-red-500': getControl('nome')?.invalid && getControl('nome')?.touched}"
        >
        <div *ngIf="getControl('nome')?.invalid && getControl('nome')?.touched" class="text-red-500 text-xs mt-1">
          <p *ngIf="getControl('nome')?.errors?.['required']">O nome é obrigatório.</p>
          <p *ngIf="getControl('nome')?.errors?.['minlength']">O nome deve ter pelo menos 2 caracteres.</p>
        </div>
      </div>
      
      <div>
        <label for="email" class="block text-sm font-medium text-gray-700">Seu Email</label>
        <input 
          formControlName="email" 
          id="email" 
          type="email"
          placeholder="seu.email@exemplo.com"
          class="mt-1 block w-full px-3 py-2 border rounded-md shadow-sm focus:outline-none focus:ring-purple-500 focus:border-purple-500"
          [ngClass]="{'border-red-500': getControl('email')?.invalid && getControl('email')?.touched}"
        >
        <div *ngIf="getControl('email')?.invalid && getControl('email')?.touched" class="text-red-500 text-xs mt-1">
          <p *ngIf="getControl('email')?.errors?.['required']">O email é obrigatório.</p>
          <p *ngIf="getControl('email')?.errors?.['email']">Por favor, insira um email válido.</p>
        </div>
      </div>
      
      <div>
        <label for="mensagem" class="block text-sm font-medium text-gray-700">Mensagem</label>
        <textarea 
          formControlName="mensagem" 
          id="mensagem" 
          rows="5"
          placeholder="Escreva sua mensagem aqui..."
          class="mt-1 block w-full px-3 py-2 border rounded-md shadow-sm focus:outline-none focus:ring-purple-500 focus:border-purple-500"
          [ngClass]="{'border-red-500': getControl('mensagem')?.invalid && getControl('mensagem')?.touched}"
        ></textarea>
        <div *ngIf="getControl('mensagem')?.invalid && getControl('mensagem')?.touched" class="text-red-500 text-xs mt-1">
          <p *ngIf="getControl('mensagem')?.errors?.['required']">A mensagem é obrigatória.</p>
          <p *ngIf="getControl('mensagem')?.errors?.['minlength']">A mensagem deve ter pelo menos 10 caracteres.</p>
          <p *ngIf="getControl('mensagem')?.errors?.['maxlength']">A mensagem não pode exceder 500 caracteres.</p>
        </div>
      </div>
      
      <div class="flex justify-end space-x-4 pt-4">
        <button 
          type="button" 
          (click)="closeModal()" 
          class="px-6 py-2 border border-gray-300 rounded-md text-sm font-medium text-gray-700 hover:bg-gray-50 focus:outline-none"
        >
          Cancelar
        </button>
        <button 
          type="submit" 
          [disabled]="contactForm.invalid || isSubmitting"
          class="px-6 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-purple-600 hover:bg-purple-700 focus:outline-none disabled:bg-gray-400"
        >
          {{ isSubmitting ? 'Enviando...' : 'Enviar Mensagem' }}
        </button>
      </div>
    </form>
  </div>
</div>
