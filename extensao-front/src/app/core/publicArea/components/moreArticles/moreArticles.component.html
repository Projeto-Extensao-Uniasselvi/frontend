<aside *ngIf="!isLoading && relatedPosts.length > 0" class="mt-24 pt-12 border-t">
  <h2 class="text-3xl font-bold text-center text-gray-800 mb-8">Ler mais artigos</h2>
  <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
    <a 
      *ngFor="let related of relatedPosts" 
      [routerLink]="['/articles', related.id]"
      class="bg-white rounded-lg shadow-md overflow-hidden transform hover:-translate-y-2 transition-transform duration-300 cursor-pointer group block"
    >
      <img 
        [src]="related.capa_url || 'https://placehold.co/400x250/cccccc/ffffff?text=Artigo'" 
        onerror="this.src='https://placehold.co/400x250/cccccc/ffffff?text=Artigo'"
        alt="Imagem de capa do artigo {{ related.titulo }}" 
        class="w-full h-48 object-cover"
      >
      <div class="p-6">
        <h3 class="text-xl font-semibold text-gray-800 mb-2 truncate group-hover:text-purple-600 transition-colors">{{ related.titulo }}</h3>
        <p class="text-sm text-gray-500 truncate">{{ related.subtitulo }}</p>
      </div>
    </a>
  </div>
</aside>
