<footer class="bg-white text-gray-900 py-4 px-8 flex flex-col md:flex-row justify-between items-center shadow-md text-center md:text-left">
  <p class="text-lg font-semibold">ECA para você</p>
  <div class="flex flex-col md:flex-row space-y-2 md:space-y-0 md:space-x-4">
    <button
      class="text-sm text-gray-600 hover:underline hover:text-gray-900 transition-colors duration-300"
      (click)="toggleContactModal()"
    >
      Contacte-nos
    </button>
    <button class="text-sm text-gray-600 hover:underline hover:text-gray-900 transition-colors duration-300">
      Rede Social
    </button>
    <button class="text-sm text-gray-600 hover:underline hover:text-gray-900 transition-colors duration-300">
      Sobre nós
    </button>
  </div>
</footer>

<app-contactModal *ngIf="isContactModalOpen" (close)="toggleContactModal()"></app-contactModal>
